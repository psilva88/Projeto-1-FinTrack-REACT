<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack - Sem conexão</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, Arial, sans-serif;
        background: #f6f7fb;
        color: #212529;
      }

      .caixa {
        max-width: 420px;
        padding: 40px 30px;
        text-align: center;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      img {
        width: 96px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 1.4rem;
        margin: 0 0 10px;
      }

      p {
        color: #6c757d;
        line-height: 1.5;
        margin: 0 0 25px;
      }

      button {
        background: #0d6efd;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #0b5ed7;
      }
    </style>
  </head>

  <body>
    <div class="caixa">
      <img src="/icone-192.png" alt="FinTrack" />

      <h1>Você está sem conexão</h1>

      <p>
        Não foi possível carregar os dados do FinTrack. Verifique sua internet
        e tente novamente.
      </p>

      <button onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
